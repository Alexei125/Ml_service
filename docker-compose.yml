services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ml_app
    env_file:
      - ./app/.env
    volumes:
      - ./app/src:/app/src
    depends_on:
      - database
      - rabbitmq
    networks:
      - ml_network
    restart: unless-stopped

  web-proxy:
    image: nginx:alpine
    container_name: ml_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - ml_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ml_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - ml_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  database:
    image: postgres:16-alpine
    container_name: ml_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ml_service
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - ml_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ml_service"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ml_worker_1
    command: python worker.py
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - ml_network
    restart: unless-stopped

  worker2:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ml_worker_2
    command: python worker.py
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    depends_on:
      app:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - ml_network
    restart: unless-stopped

networks:
  ml_network:
    driver: bridge
