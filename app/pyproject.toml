[tool.poetry]
name = "ml-service"
version = "1.0.0"
description = "ML Service with balance and transactions"
authors = ["Your Name <your@email.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.139.2"
uvicorn = {extras = ["standard"], version = "^0.51.0"}
pydantic = "^2.13.4"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
pika = "^1.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"