[tool.poetry]
name = "ml-service"
version = "1.0.0"
description = "ML Service"
authors = ["Your Name <email@mail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
python-dotenv = "^1.0.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
pika = "^1.3.2"
joblib = "^1.3.0"
scikit-learn = "^1.3.0"
email-validator = "^2.3.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = "^1.7.4"
bcrypt = "^4.1.0"
jinja2 = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

